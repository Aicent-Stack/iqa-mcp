[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqa-mcp"
version = "0.1.0"
description = "IQA attestation primitives (derived intent addressing + AE-128 envelope verification) as Model Context Protocol tools. Offline, fail-closed, stateless."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RTTP & IQA Organization" }]
keywords = ["mcp", "iqa", "rttp", "attestation", "agents", "offline"]
dependencies = [
  "iqa-org>=1.3.1",
  "mcp>=2.0",
]

[project.scripts]
iqa-mcp = "server:mcp.run"

[tool.setuptools]
py-modules = ["server"]
